// Litematica Printer Forge — 纯 Gradle(java) 构建
//
// 为什么不用 ForgeGradle：
//   本仓库源码直接使用 1.20.1 生产环境 SRG 名称（m_xxx/f_xxx），编译期依赖
//   直接取自本地 .minecraft/libraries（client srg jar + forge jars）与 libs/
//   目录下的 MaFgLib / Forgematica。不需要 reobf / 运行时映射，产出即生产 JAR。
//
// 构建：gradlew build  →  build/libs/litematica_printer_forge-<version>.jar

plugins {
    id 'java'
}

group = mod_group_id
version = mod_version

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // 第三方前置 mod（MaFgLib 含 malilib，Forgematica 含 litematica 类）
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    // Sophisticated Backpacks API（BII 背包注入用）
    compileOnly files(
            "${rootDir}/../../../sophisticatedbackpacks-1.20.1-3.23.15.1236.jar",
            "${rootDir}/../../../sophisticatedcore-1.20.1-1.2.55.975.jar"
    )

    // 本地 Minecraft 库（forge、client srg、mixin、fastutil、guava 等）
    // 不用整目录 fileTree：本地 libraries 里混有多个 MC/Forge 版本的 jar，
    // javac 按顺序首个命中解析，顺序不确定会产生"符号不存在"错误。
    // gradle/compile-classpath.txt 是实测可 0 错误编译的精确清单（顺序敏感）。
    def cpList = file('gradle/compile-classpath.txt').readLines('UTF-8')
            .findAll { it.trim() && !it.startsWith('#') }
            .collect { file(it.trim()) }
            .findAll { it.exists() }
    compileOnly files(cpList)
}

compileJava {
    options.encoding = 'UTF-8'
    options.release.set(17)
    // Mixin 注解处理在本构建中关闭：目标全部直接书写 SRG 名称，无需 refmap 重生成
    options.compilerArgs += ['-proc:none']
}

processResources {
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

jar {
    archiveBaseName.set(mod_archives_name)
    archiveVersion.set(project.version)
    manifest {
        attributes(
                'Specification-Title' : 'litematica_printer_forge',
                'Specification-Vendor': 'jxmm',
                'Specification-Version': '1',
                'Implementation-Title': 'litematica-printer-forge',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'jxmm',
                'MixinConfigs': 'litematica_printer_forge.mixins.json'
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
